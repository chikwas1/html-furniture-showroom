<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FURNITURE ORDER PAGE</title>
  <link rel="stylesheet" href="cfs-order.css">
</head>
<body>
  <div class="whole-container">
    <div class="header">
      <div class="back">
        <button>Back</button>
      </div>
      <h1>
        CH!<br>kW4S
      </h1>
    </div>

    <div>
      <p> <h2>YOUR ORDERS</h2></p>
    </div>
    <div class="options">
      <div>Order Date:</div>
      <div>Payment:</div>
    </div>

    <div class="grid">
        <div class="product-image">
          <img src="images/images-1.jpg" alt="">
        </div>

        <div>
          product id
        </div>
        <div>
          product name
        </div>
        <div>
          product rating
        </div>
        <div>
          product price
        </div>
        </div>

        <div>
          quantity
          <label for="quantity">
            <select name="numbers" id="">
              <option value="1">1</option>
              <option value="">2</option>
              <option value="">3</option>
            </select>
          </label>
        </div>
      </div>
      <div class="buttons">
        <button>Checkout</button>
        <button>Cancel Order</button>
        <button>track Order</button>
        <div>Delivery Date:</div>
      </div>
    </div>

  </div>

  <script type="module" src="orders.js"></script>
</body>
</html>
